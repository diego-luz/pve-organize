<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pve-organize styles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
:root {
  --fundo-pagina: #141416; --painel: #232325; --texto: #dfdfdf; --texto2: #9a9a9e; --borda: #3a3a3d;
  --hover: #3b3b3e; --sel: #4b4b4f; --cartao: #1c1c1e;
}
:root[data-tema="claro"] {
  --fundo-pagina: #eef0f3; --painel: #ffffff; --texto: #1f1f1f; --texto2: #66666a; --borda: #d4d6da;
  --hover: #eaf2fb; --sel: #c1ddf1; --cartao: #f7f8fa;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo-pagina); color: var(--texto);
  font: 13px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
header { padding: 20px 16px 8px; max-width: 1500px; margin: 0 auto; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: var(--texto2); max-width: 820px; }
.controles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.controles button { background: var(--painel); color: var(--texto); border: 1px solid var(--borda);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
.controles button.ativo { border-color: #4a90d9; box-shadow: 0 0 0 1px #4a90d9 inset; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px;
  padding: 12px 16px 32px; max-width: 1500px; margin: 0 auto; }
.modelo { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column; }
.modelo h2 { margin: 0; padding: 10px 12px 2px; font-size: 15px; }
.modelo .desc { padding: 0 12px 10px; color: var(--texto2); font-size: 12px; min-height: 48px; }
.arvore { background: var(--painel); border-top: 1px solid var(--borda); padding: 4px 0 8px; flex: 1; }

/* linhas da árvore */
.linha { display: flex; align-items: center; height: 22px; padding-left: 30px; padding-right: 8px;
  white-space: nowrap; cursor: default; position: relative; }
.linha:hover { background: var(--hover); }
.linha.sel { background: var(--sel); }
.linha .ic { width: 18px; text-align: center; margin-right: 5px; position: relative; color: var(--texto); opacity: .9; }
.linha .ic .st { position: absolute; right: -3px; bottom: -2px; font-size: 9px; color: #3ec43e; }
.linha.parado .ic { opacity: .45; }
.linha.parado .ic .st { display: none; }
.tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 15px;
  background: #6c7a89; color: #fff; }
.no { padding-left: 14px; height: 24px; }
.no .ic { color: var(--texto); }
.contador { margin-left: auto; font-weight: 600; opacity: .75; font-size: 10.5px; letter-spacing: 0; }

/* ======== A: atual (faixa + bolinha) ======== */
.A .t1 { margin: 8px 6px 2px 6px; height: 20px; display: flex; align-items: center; padding-left: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--c);
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, transparent), transparent 85%);
  border-left: 4px solid var(--c); border-radius: 3px; }
.A .t2 { margin: 4px 8px 1px 26px; height: 16px; display: flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--c); }
.A .t2::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.A .t2::after { content: ''; flex: 1; height: 1px; background: color-mix(in srgb, var(--c) 45%, transparent); }

/* ======== B: etiqueta sólida + contador ======== */
.B .t1 { margin: 10px 8px 3px 8px; display: flex; align-items: center; gap: 8px; }
.B .t1 span.p { background: var(--c); color: var(--tc); font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; padding: 2px 9px; border-radius: 999px; }
.B .t1::after { content: ''; flex: 1; height: 1px; background: var(--borda); }
.B .t1 .contador { order: 3; margin-left: 0; color: var(--texto2); }
.B .t2 { margin: 4px 8px 1px 28px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--c); font-weight: 600; }
.B .t2 span.p { border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); padding: 0 7px; border-radius: 999px; line-height: 15px; }
.B .t2 .contador { margin-left: 0; color: var(--texto2); }

/* ======== C: trilho lateral contínuo ======== */
.C .t1 { margin: 10px 6px 0 6px; padding-left: 10px; height: 22px; display: flex; align-items: center;
  font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c);
  border-left: 3px solid var(--c); }
.C .t2 { margin: 0 6px 0 6px; padding-left: 22px; height: 18px; display: flex; align-items: center;
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: color-mix(in srgb, var(--c2) 85%, var(--texto));
  border-left: 3px solid var(--c); position: relative; }
.C .t2::before { content: ''; position: absolute; left: 12px; top: 4px; bottom: 0; width: 2px; background: var(--c2); border-radius: 2px; }
.C .linha.g { margin: 0 6px; border-left: 3px solid var(--c); padding-left: 21px; }
.C .linha.g.sf { padding-left: 21px; }
.C .linha.g.sf::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: var(--c2); }
.C .linha.g.sf { padding-left: 27px; }

/* ======== D: cartões ======== */
.D .grupo { margin: 8px 6px 4px; border-radius: 8px; overflow: hidden;
  background: color-mix(in srgb, var(--c) 9%, var(--painel)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.D .t1 { padding: 5px 10px; display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--c);
  border-bottom: 1px solid color-mix(in srgb, var(--c) 25%, transparent); }
.D .t1 i { font-size: 12px; }
.D .t2 { margin: 5px 10px 1px 14px; font-size: 10.5px; font-weight: 600; color: var(--c2); display: flex; gap: 6px; align-items: center; }
.D .t2::before { content: ''; width: 3px; height: 11px; border-radius: 2px; background: var(--c2); }
.D .linha { padding-left: 22px; }
.D .linha.sf { padding-left: 30px; }

/* ======== E: minimalista ======== */
.E .t1 { margin: 12px 10px 2px 12px; display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--texto2); }
.E .t1::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.E .t1 .contador { color: var(--texto2); opacity: .7; }
.E .t2 { margin: 3px 10px 0 30px; font-size: 10.5px; color: var(--texto2); display: flex; align-items: center; gap: 5px; }
.E .t2::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); opacity: .9; }
.E .linha.sf { padding-left: 40px; }

/* ======== F: cabeçalho cheio ======== */
.F .t1 { margin: 8px 0 2px; padding: 0 10px; height: 22px; display: flex; align-items: center; gap: 8px;
  background: var(--c); color: var(--tc); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.F .t1 .contador { opacity: .85; color: var(--tc); }
.F .t2 { margin: 3px 8px 1px 20px; padding: 1px 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--c); border-bottom: 2px solid color-mix(in srgb, var(--c) 60%, transparent); width: fit-content; }
.F .linha.sf { padding-left: 38px; }

.rodape { max-width: 1500px; margin: 0 auto; padding: 0 16px 28px; color: var(--texto2); font-size: 12px; }
@media (max-width: 600px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>pve-organize: available styles</h1>
  <p>The same (fictional) groups and guests in six styles. Hover and click the rows to see the selection
    highlight. In Proxmox you pick the style in the "Tree groups" screen.</p>
  <div class="controles">
    <button data-tema="escuro" class="ativo">Dark theme</button>
    <button data-tema="claro">Light theme</button>
    <button id="cont" class="ativo">Show counter</button>
    <button id="recuo" class="ativo">Indent subcategory items</button>
  </div>
</header>
<main id="modelos"></main>
<div class="rodape">All styles come with pve-organize; colors are set in the "Tree groups" screen.</div>

<script>
const GRUPOS = [
  { nome: 'Production', cor: '#2e7d32', subs: [
    { nome: 'Network', cor: '#1565c0', itens: [['200', 'firewall', 'vm'], ['201', 'dns-01']] },
    { nome: 'Management', cor: '#6a1b9a', itens: [['210', 'automation'], ['211', 'monitor']] },
    { nome: 'Services', cor: '#00897b', itens: [['220', 'web-01'], ['221', 'web-02'], ['222', 'db-01'],
      ['223', 'files'], ['224', 'wiki']] },
  ] },
  { nome: 'Testing', cor: '#f9a825', subs: [{ itens: [['300', 'lab-01', 'ct', 1], ['301', 'lab-02']] }] },
  { nome: 'Disabled', cor: '#757575', subs: [{ itens: [['400', 'old-app', 'ct', 1]] }] },
  { nome: 'Template', cor: '#455a64', subs: [{ itens: [['900', 'debian-template', 'tpl', 1]] }] },
];
const MODELOS = [
  ['A', 'A · Band (default)', 'Tinted band with a left bar for top levels; dot and line for subcategories.'],
  ['B', 'B · Pills', 'Top level as a solid pill followed by a thin line; subcategory as an outlined pill. Clean and modern.'],
  ['C', 'C · Side rail', 'A colored bar runs down the whole group; subcategories get their own thin rail. Shows clearly where a group starts and ends.'],
  ['D', 'D · Cards', 'Each top level becomes a block with a lightly tinted background and rounded corners. The most grouped look.'],
  ['E', 'E · Minimal', 'Discreet gray headers with a small color square. As little color as possible; a calmer tree.'],
  ['F', 'F · Solid header', 'Full-width solid color header; underlined subcategory. The boldest, easy to spot while scrolling.'],
];
const contraste = (hex) => {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b > 160 ? '#000' : '#fff';
};
const icone = (tipo) => tipo === 'vm' ? 'fa-desktop' : tipo === 'tpl' ? 'fa-file-o' : 'fa-cube';
const total = (g) => g.subs.reduce((s, x) => s + x.itens.length, 0);

function linhaHTML([id, nome, tipo, parado, tag], classes) {
  return `<div class="linha ${parado ? 'parado' : ''} ${classes}"><span class="ic"><i class="fa ${icone(tipo)}"></i>`
    + `<i class="fa fa-play st"></i></span>${id} (${nome})${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
}

function montar(letra) {
  let h = `<div class="linha no"><span class="ic"><i class="fa fa-server"></i></span>Datacenter</div>`
    + `<div class="linha no" style="padding-left:24px"><span class="ic"><i class="fa fa-building"></i></span>pve01</div>`;
  for (const g of GRUPOS) {
    const vars = `--c:${g.cor};--tc:${contraste(g.cor)}`;
    const cont = `<span class="contador">${total(g)}</span>`;
    let titulo;
    if (letra === 'B') titulo = `<div class="t1" style="${vars}"><span class="p">${g.nome}</span>${cont}</div>`;
    else if (letra === 'D') titulo = `<div class="t1"><i class="fa fa-folder-open"></i>${g.nome}${cont}</div>`;
    else titulo = `<div class="t1" style="${vars}">${g.nome}${cont}</div>`;
    let corpo = '';
    for (const s of g.subs) {
      const sv = `--c:${letra === 'C' ? g.cor : (s.cor || g.cor)};--c2:${s.cor || g.cor}`;
      if (s.nome) {
        const sc = `<span class="contador">${s.itens.length}</span>`;
        corpo += letra === 'B'
          ? `<div class="t2" style="${sv};--c:${s.cor}"><span class="p">${s.nome}</span>${sc}</div>`
          : `<div class="t2" style="${sv}">${s.nome}${letra === 'E' || letra === 'D' ? '' : ''}</div>`;
      }
      for (const it of s.itens) {
        corpo += linhaHTML(it, `${letra === 'C' ? 'g' : ''} ${s.nome ? 'sf' : ''}`).replace('class="linha', `style="${sv}" class="linha`);
      }
    }
    h += letra === 'D' ? `<div class="grupo" style="${vars}">${titulo}${corpo}</div>` : titulo + corpo;
  }
  return h;
}

const main = document.getElementById('modelos');
main.innerHTML = MODELOS.map(([l, t, d]) =>
  `<section class="modelo"><h2>${t}</h2><div class="desc">${d}</div><div class="arvore ${l}">${montar(l)}</div></section>`).join('');

main.addEventListener('click', (e) => {
  const linha = e.target.closest('.linha:not(.no)');
  if (!linha) return;
  linha.closest('.arvore').querySelectorAll('.sel').forEach((x) => x.classList.remove('sel'));
  linha.classList.add('sel');
});
document.querySelectorAll('[data-tema]').forEach((b) => b.onclick = () => {
  document.documentElement.dataset.tema = b.dataset.tema;
  document.querySelectorAll('[data-tema]').forEach((x) => x.classList.toggle('ativo', x === b));
});
const alternar = (id, css) => {
  const st = document.createElement('style'); document.head.appendChild(st);
  document.getElementById(id).onclick = (e) => {
    const on = e.target.classList.toggle('ativo');
    st.textContent = on ? '' : css;
  };
};
alternar('cont', '.contador{display:none!important}');
alternar('recuo', '.linha.sf{padding-left:30px!important}.C .linha.g.sf{padding-left:21px!important}');
</script>
</body>
</html>
